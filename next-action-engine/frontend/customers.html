<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - DealFlow360 ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-8">
                    <a href="dashboard.html" class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow-sm">✦</div>
                        <span class="font-bold text-lg text-slate-900 tracking-tight">DealFlow<span class="text-blue-600">360</span></span>
                    </a>
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="dashboard.html" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg">Dashboard</a>
                        <a href="products.html" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg">Products</a>
                        <a href="quotations.html" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg">Quotations</a>
                        <a href="customers.html" class="px-3.5 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg">Customers</a>
                        <a href="orders.html" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg">Orders</a>
                        <a href="purchases.html" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg">Purchases</a>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full border border-slate-200 font-mono">
                        Session: <span id="current-session-badge" class="font-bold text-slate-800">...</span>
                    </div>
                    <a href="purchases.html" class="relative p-2 text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Customer Accounts</h1>
            <p class="text-sm text-slate-500 mt-1">Enterprise client directories, discount tiers, and communication history.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="customers-grid">
            <!-- Dynamic customers -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            DealFlow360 Next Action ERP · Interactive Machine Learning Recommendation Demo
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/actionTracker.js"></script>
    <script src="js/recommendation.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            trackAction('open_customers');
            const data = await API.getErpData();
            if (data && data.customers) {
                const grid = document.getElementById('customers-grid');
                grid.innerHTML = data.customers.map(c => `
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[11px] font-bold uppercase tracking-wider text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-md">${c.tier}</span>
                                <span class="text-xs text-slate-400 font-mono">${c.id}</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900">${c.name}</h3>
                            <p class="text-xs font-semibold text-slate-500 mt-0.5">${c.company}</p>
                            <p class="text-xs text-slate-400 mt-2">${c.email}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-5">
                            <button onclick="viewCustomerDetails('${c.id}', '${c.company}')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 text-xs font-semibold rounded-md transition-colors">
                                View Profile
                            </button>
                            <button onclick="createQuoteForCustomer('${c.id}', '${c.company}')" class="px-3 py-1.5 text-blue-600 hover:bg-blue-50 text-xs font-semibold rounded-md">
                                + Create Quote
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        });

        async function viewCustomerDetails(id, company) {
            // High-intent profile inspection -> AI recommends viewing open quotations!
            await trackAction('view_customer', { customer_id: id, company: company });
            showToast(`Opened profile for ${company}`);
        }

        async function createQuoteForCustomer(id, company) {
            await trackAction('create_customer', { customer_id: id, company: company });
            window.location.href = 'quotations.html';
        }
    </script>
</body>
</html>
